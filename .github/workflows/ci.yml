name: ci

on:
  push:
    branches: [master, 'tmp/**']
  pull_request:

# A push replaces the run before it rather than racing it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every job and every step that waits on code under test carries a ceiling: without one a hung
# test runs until GitHub's own six-hour limit.
jobs:
  check:
    # No macOS: the library is managed code with no platform-specific path, so a third system
    # would prove nothing these two do not, and its minutes bill at ten times the rate. Windows
    # is here for net472, which runs the net45 build on the real .NET Framework.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          # The SDK comes from global.json; the net8.0 tests need the 8.0 runtime beside it.
          dotnet-version: 8.0.x
          global-json-file: global.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: dotnet tool restore
      - run: python scripts/charset.py
      - run: python scripts/format.py
      - run: python scripts/build.py
      - run: python scripts/test.py
        timeout-minutes: 3
      - run: python scripts/analyze.py
        timeout-minutes: 4
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: inspect-sarif-${{ matrix.os }}
          path: artifacts/inspect.sarif

  package:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      # Pack also validates the package against the released 1.1.1.
      - run: dotnet pack src/Wiry.Base32/Wiry.Base32.csproj -c Release -o artifacts/package
      - name: Package holds exactly the three assemblies, their docs and the readme
        run: |
          unzip -Z1 artifacts/package/*.nupkg | sort
          actual=$(unzip -Z1 artifacts/package/*.nupkg | grep -E '^(lib/|README.md$)' | LC_ALL=C sort | tr '\n' ' ')
          expected="README.md lib/net45/Wiry.Base32.dll lib/net45/Wiry.Base32.xml lib/netstandard1.1/Wiry.Base32.dll lib/netstandard1.1/Wiry.Base32.xml lib/netstandard2.0/Wiry.Base32.dll lib/netstandard2.0/Wiry.Base32.xml "
          test "$actual" = "$expected"
      - name: Parity with 1.1.1 on every assembly in the package
        run: tools/parity/run.sh artifacts/package/*.nupkg 20
        timeout-minutes: 10
      - name: An app compiled against 1.1.1 runs on the package
        run: tools/compat-guard/run.sh artifacts/package/*.nupkg net10.0
        timeout-minutes: 3
      # The same commit packed from another directory must give the same assemblies.
      - uses: actions/checkout@v7
        with:
          path: second
      - run: dotnet pack second/src/Wiry.Base32/Wiry.Base32.csproj -c Release -o artifacts/second
      - name: Assemblies are reproducible
        run: |
          for side in package second; do
            mkdir -p "artifacts/$side-lib"
            unzip -q artifacts/$side/*.nupkg 'lib/*' -d "artifacts/$side-lib"
            (cd "artifacts/$side-lib" && sha256sum lib/*/*.dll) > "artifacts/$side.sha256"
          done
          cat artifacts/package.sha256
          diff artifacts/package.sha256 artifacts/second.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: package
          path: |
            artifacts/package/*.nupkg
            artifacts/package/*.snupkg

  framework:
    # The net45 assembly from the package under the real .NET Framework, loaded by an app
    # compiled against 1.1.1.
    needs: package
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@v7
        with:
          name: package
          path: artifacts/package
      - run: tools/compat-guard/run.sh artifacts/package/*.nupkg net472
        shell: bash
        timeout-minutes: 3
